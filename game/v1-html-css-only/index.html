<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game of Pig</title>

 <!-- Google fonts -->   
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@98.6,300..700&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">   
<!-- Google fonts -->

    <link href="styles.css" rel="stylesheet">

</head>
<body>
<div class="title-row">
    <h1>GAME OF PIG</h1>
    <img src="images/Dice.png" alt="dice icon" class="title-dice">
</div>
    <div class="game-container">
    
    <div class="player player1">
        <h2>Player 1</h2>

        <div class="player-content">
            <div class="dice"></div>
            <div class="score-box">TOTAL</div>
        </div>
    </div>

    <div class="controls">
        <button>Set Score</button>
        <button>Roll Dice</button>
    </div>

    <div class="player player2">
        <h2>Player 2</h2>

        <div class="player-content">
            <div class="dice"></div>
            <div class="score-box">TOTAL</div>
        </div>
    </div>

</div>

    <div class="console">
        <p>Console Message:</p>
    </div>
</body>
</html>
